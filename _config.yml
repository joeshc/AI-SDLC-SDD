# Site settings for https://joeshc.github.io/AI-SDLC-SDD/
# Project site: served from the AI-SDLC-SDD repo, so baseurl carries the repo name.
# If this ever moves to a user site (repo named joeshc.github.io), set baseurl to "".
url: "https://joeshc.github.io"
baseurl: "/AI-SDLC-SDD"

title: "Joe Nishanth"
tagline: "Notes on AI agents, applied GenAI, and the engineering discipline around them."
author: "Joe Nishanth"
description: "Engineering notes on AI agents, spec-driven development, and building AI systems that hold up in regulated domains."

# This site ships its own _layouts and assets/css/main.css. Without this, the
# github-pages gem silently applies its default theme (jekyll-theme-primer).
theme: null

encoding: utf-8
markdown: kramdown
highlighter: rouge
permalink: /blog/:title/

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    disable: true

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
