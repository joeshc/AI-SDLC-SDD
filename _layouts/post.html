---
layout: default
---
<article class="post">
  <div class="post__head">
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}<p class="post__subtitle">{{ page.subtitle }}</p>{% endif %}
    <p class="post__meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time>
      {% if page.reading_time %}<span class="post__sep"></span>{{ page.reading_time }}{% endif %}
    </p>
  </div>

  <div class="prose">
    {{ content }}
  </div>
</article>
