---
layout: default
---
<article class="post">
  <div class="post__head">
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}<p class="post__subtitle">{{ page.subtitle }}</p>{% endif %}
    <p class="post__meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time>
      {% if page.reading_time %}<span class="post__sep"></span>{{ page.reading_time }}{% endif %}
    </p>
  </div>

  <div class="prose">
    {{ content }}
  </div>

  <aside class="author-card">
    <p class="author-card__label">Written by</p>
    <!-- Official LinkedIn profile badge. The inner link is the fallback: if the
         LinkedIn script is blocked or fails, this still renders as a plain link. -->
    <div class="badge-base LI-profile-badge"
         data-locale="en_US"
         data-size="medium"
         data-theme="light"
         data-type="VERTICAL"
         data-vanity="joe-nishanth"
         data-version="v1">
      <a class="badge-base__link LI-simple-link"
         href="https://in.linkedin.com/in/joe-nishanth?trk=profile-badge">Joe Nishanth</a>
    </div>
  </aside>
</article>

<script src="https://platform.linkedin.com/badges/js/profile.js" async defer type="text/javascript"></script>
